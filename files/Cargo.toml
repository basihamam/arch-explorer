[package]
name = "arch-explorer"
version = "0.1.0"
description = "A blazing fast, fully customizable file explorer for Arch Linux"
authors = ["ALX"]
edition = "2021"

[lib]
name = "arch_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "arch-explorer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
trash = "3"
open = "5"
notify = "6"
dirs = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
zbus = { version = "4", default-features = false, features = ["tokio"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
